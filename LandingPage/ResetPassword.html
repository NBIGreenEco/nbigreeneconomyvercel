<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password - Green Economy Toolkit</title>

    <link rel="stylesheet" href="/styles/output.css" />
    <link
      rel="stylesheet"
      href="/Master Page(Header and Footer)/MasterPage.css"
    />

    <script
      src="https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js"
      type="module"
    ></script>
    <script
      src="https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js"
      type="module"
    ></script>

    <style>
      body {
        font-family: "Poppins", sans-serif;
        background-color: #f8fffe;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }

      .container {
        background: white;
        padding: 2rem;
        border-radius: 1rem;
        max-width: 420px;
        width: 100%;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      h1 {
        color: #005d6a;
        margin-bottom: 1rem;
      }

      p {
        margin-bottom: 1.5rem;
        color: #333;
      }

      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 1rem;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 1rem;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #4eb5a6;
        color: white;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      button:hover {
        background-color: #005d6a;
      }

      .loading {
        display: none;
        margin-bottom: 1rem;
      }

      .error {
        color: #dc3545;
        margin-top: 1rem;
        display: none;
      }

      .success {
        color: #4eb5a6;
        margin-top: 1rem;
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Reset Password</h1>
      <p>Enter your new password below.</p>

      <div class="loading" id="loading">Resetting password…</div>

      <input type="password" id="password" placeholder="New password" />
      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm new password"
      />

      <button id="resetBtn">Reset Password</button>

      <div class="success" id="successMsg"></div>
      <div class="error" id="errorMsg"></div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";
      import {
        getAuth,
        confirmPasswordReset,
      } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyCfa827mvCLf1ETts6B_DmCfb7owTohBxk",
        authDomain: "nbi-green-economy.firebaseapp.com",
        projectId: "nbi-green-economy",
        storageBucket: "nbi-green-economy.firebasestorage.app",
        messagingSenderId: "53732340059",
        appId: "1:53732340059:web:3fb3f086c6662e1e9baa7e",
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      const params = new URLSearchParams(window.location.search);
      const oobCode = params.get("oobCode");

      const resetBtn = document.getElementById("resetBtn");
      const loading = document.getElementById("loading");
      const errorMsg = document.getElementById("errorMsg");
      const successMsg = document.getElementById("successMsg");

      if (!oobCode) {
        errorMsg.textContent = "Invalid or expired password reset link.";
        errorMsg.style.display = "block";
        resetBtn.disabled = true;
      }

      resetBtn.addEventListener("click", async () => {
        const password = document.getElementById("password").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        errorMsg.style.display = "none";
        successMsg.style.display = "none";

        if (password.length < 6) {
          errorMsg.textContent = "Password must be at least 6 characters.";
          errorMsg.style.display = "block";
          return;
        }

        if (password !== confirmPassword) {
          errorMsg.textContent = "Passwords do not match.";
          errorMsg.style.display = "block";
          return;
        }

        try {
          loading.style.display = "block";
          resetBtn.disabled = true;

          // 🔑 THIS IS THE CRITICAL LINE
          await confirmPasswordReset(auth, oobCode, password);

          loading.style.display = "none";
          successMsg.innerHTML = `
          <strong>Password reset successful!</strong><br/>
          Redirecting to Sign In…
        `;
          successMsg.style.display = "block";

          setTimeout(() => {
            window.location.href =
              "https://www.greeneconomytoolkit.com/LandingPage/SignInAndSignUp/SignIn.html";
          }, 3000);
        } catch (error) {
          loading.style.display = "none";
          resetBtn.disabled = false;
          errorMsg.textContent = error.message;
          errorMsg.style.display = "block";
        }
      });
    </script>
  </body>
</html>
